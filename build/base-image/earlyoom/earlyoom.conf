# earlyoom configuration for thin clients
# -m 15: trigger when available RAM drops below 15% (default: 10%)
# -s 10: trigger when free swap drops below 10%
# -r 10: log memory stats every 10 seconds (default: 3600)
# --prefer: kill Chrome/Teams first (they recover gracefully on relaunch)
# --avoid: protect display server, session manager, init, login manager, warehouse app, and telemetry
EARLYOOM_ARGS="-m 15 -s 10 -r 10 --prefer '(chrome|teams)' --avoid '(Xorg|systemd|dbus|gdm|probas|wine|telegraf)'"
